# Configuration for the junction_cluster.osm test fixture.
#
# The fixture itself is not committed (see
# autoware_lanelet2_to_opendrive/test/data/README.md). This config is kept
# so that a locally produced copy converts without further setup.
#
# The fixture is a junction cluster whose geometry comes from a real urban
# map (see autoware_lanelet2_to_opendrive/test/data/README.md), rebuilt at
# this origin with fresh ids. Left-hand traffic, because the source network
# is laid out for it and reading it as right-hand traffic would invert the
# relationship between each lanelet and its neighbours.

# MGRS grid for map projection (REQUIRED)
mgrs_grid: 54SUE
offset:
  x: 81655.73
  y: 50137.43
  z: 0

traffic_rule: "LHT"

# No preprocessing: the fixture is meant to exercise the conversion itself,
# so anything that has to be patched up beforehand belongs in the fixture.
merge_operations:
move_point_operations:
delete_point_operations:
remove_lanelet_operations:
remove_turn_direction_operations:

# ParamPoly3 segment generation configuration
parampoly3:
  enabled: true
  min_segment_length: 0.5  # meters (CARLA minimum requirement)
  default_segment_length: 1.0  # meters
  max_segments: 100
  min_segments: 1
  coefficient_epsilon: 1.0e-8

# Width spline sampling configuration
width_estimation:
  adaptive_sampling: true
  min_samples: 5
  max_samples: 50
  default_sample_interval: 5.0  # meters
