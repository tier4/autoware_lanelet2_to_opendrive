# Example map configuration with no origin specification at all
#
# Named for the `offset` key it used to carry. That key is gone -- exported
# coordinates are always in the frame the projector defines -- and so is the
# `mgrs_grid` key, because the frame is resolved from the map rather than
# declared. What is left is a config that selects no preprocessing and no
# per-map overrides. The name is kept because several test modules and a CI
# step pass `map=example_mgrs_offset` on the command line.

# No origin keys: the coordinate frame comes from a map_projector_info.yaml
# next to the .osm map, or failing that from the map's own node coordinates.

# Merge operations - merge multiple lanelets into one
merge_operations:
  # - lanelet_ids: [100, 101, 102]

# Remove operations - remove lanelets from the map
remove_operations:
  # - lanelet_ids: [300, 301, 302]

# Replace operations - replace multiple lanelets with a single merged one
replace_operations:
  # - lanelet_ids: [500, 501, 502]

# Move point operations - adjust individual point positions
move_point_operations:
  # - point_id: 12345
  #   new_x: 100.5
  #   new_y: 200.3

# Delete point operations - remove points from linestrings
delete_point_operations:
  # - point_ids: [12345, 12346]

# Remove lanelet operations - completely remove lanelets
remove_lanelet_operations:
  # - lanelet_ids: [900, 901]

# Remove turn direction operations - remove turn_direction attributes
remove_turn_direction_operations:
  # - lanelet_ids: []
