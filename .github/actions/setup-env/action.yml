name: Setup Environment
description: >
  Common CI environment setup: Python, uv, an optional 'uv sync --dev', and
  optional pre-commit execution. Every dependency installs from a wheel, so
  there is no apt step and no compiler in the loop.

inputs:
  python-version:
    description: Python version to set up
    required: false
    default: "3.10"
  install-dev-deps:
    description: Run 'uv sync --dev' to install Python dependencies
    required: false
    default: "true"
  run-precommit:
    description: Run 'pre-commit run --all-files' (no 'install' — CI never commits)
    required: false
    default: "false"
  precommit-continue-on-error:
    description: Continue even if pre-commit fails (uses '|| true')
    required: false
    default: "false"
  carla-extra:
    description: "uv extra for CARLA version selection (e.g. 'carla' for 0.10.0, 'carla-0-9-16' for 0.9.16)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        # Only enable the uv cache when we are actually going to populate it.
        # When 'install-dev-deps' is "false" (e.g. release.yml's early
        # 'Setup base environment' step on a no-bump-label push), 'uv sync'
        # never runs, the cache dir stays empty, and setup-uv@v4's post-step
        # save fails the job with 'Cache path ... does not exist on disk'.
        enable-cache: ${{ inputs.install-dev-deps }}
        cache-dependency-glob: "**/uv.lock"

    - name: Install Python dependencies
      if: inputs.install-dev-deps == 'true'
      shell: bash
      run: |
        if [ -n "${{ inputs.carla-extra }}" ]; then
          uv sync --dev --extra "${{ inputs.carla-extra }}"
        else
          uv sync --dev
        fi

    - name: Run pre-commit hooks
      if: inputs.run-precommit == 'true' && inputs.precommit-continue-on-error == 'false'
      shell: bash
      run: uv run pre-commit run --all-files

    - name: Run pre-commit hooks (continue on error)
      if: inputs.run-precommit == 'true' && inputs.precommit-continue-on-error == 'true'
      shell: bash
      run: uv run pre-commit run --all-files || true
