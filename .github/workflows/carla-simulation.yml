name: CARLA Simulation

# CPU-only CARLA traffic-simulation CI.
#
# For each scenario in the matrix this workflow boots a headless CARLA 0.9.15
# server (Null RHI, no GPU) via the reusable `carla-simulation` composite
# action and runs a Traffic-Manager-driven simulation on a built-in CARLA town
# map, asserting that the traffic actually moved. Using a bundled map keeps CI
# self-contained — no OpenDRIVE conversion or map data is required.
#
# Add a new scenario by appending an entry to the `matrix.include` list below —
# the composite action is scenario-agnostic, so no other file needs to change.
# (The composite action also accepts `xodr-path` instead of `map` if you want
# to simulate a converted OpenDRIVE map.)

on:
  workflow_dispatch:
    inputs:
      num-vehicles:
        description: Override the number of vehicles to spawn.
        required: false
        default: "8"
      ticks:
        description: Override the number of synchronous ticks to simulate.
        required: false
        default: "120"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "autoware_carla_scenario/ci/**"
      - ".github/actions/carla-simulation/**"
      - ".github/workflows/carla-simulation.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "autoware_carla_scenario/ci/**"
      - ".github/actions/carla-simulation/**"
      - ".github/workflows/carla-simulation.yml"

concurrency:
  group: carla-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: ${{ matrix.name }} (CARLA ${{ matrix.carla-client-version }})
    # Stock GitHub-hosted runner — no GPU and no larger/self-hosted runner. The
    # CARLA server is CPU-only (Null RHI) and the world is a bundled town map,
    # so nothing here needs to build the lanelet2 bindings.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Scenarios ---------------------------------------------------
          # Each entry runs a traffic simulation on a built-in CARLA town map.
          # Vehicle/tick counts are deliberately small to fit a stock runner.
          - name: town03-traffic
            map: Town03
            num-vehicles: "8"
            ticks: "120"
            min-total-distance: "5.0"
            carla-image: carlasim/carla:0.9.15
            carla-client-version: "0.9.15"

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space for the CARLA image
        run: |
          # The carlasim/carla image is several GB; stock runners only ship
          # ~14 GB free. Drop preinstalled toolchains we do not need.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}" || true
          df -h /

      - name: Run CPU-only CARLA traffic simulation
        uses: ./.github/actions/carla-simulation
        with:
          map: ${{ matrix.map }}
          scenario-name: ${{ matrix.name }}
          carla-image: ${{ matrix.carla-image }}
          carla-client-version: ${{ matrix.carla-client-version }}
          num-vehicles: ${{ github.event.inputs.num-vehicles || matrix.num-vehicles }}
          ticks: ${{ github.event.inputs.ticks || matrix.ticks }}
          min-total-distance: ${{ matrix.min-total-distance }}
