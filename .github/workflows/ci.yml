name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    # The workspace is capped at Python 3.10 by the CARLA client wheel, not by
    # anything of ours -- see 'converter-on-modern-python' below.
    name: test (3.10, ${{ matrix.carla-extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        carla-extra: ["carla", "carla-0-9-16"]

    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        python-version: "3.10"
        install-dev-deps: "true"
        run-precommit: "false"
        carla-extra: ${{ matrix.carla-extra }}

    - name: Run tests
      run: uv run pytest -v --tb=short -n auto -o addopts=

    - name: Check package can be built
      run: |
        uv build --package autoware-lanelet2-to-opendrive
        uv build --package autoware-carla-scenario

  converter-on-modern-python:
    # autoware-lanelet2-to-opendrive declares 'requires-python >= 3.10' and now
    # installs entirely from wheels; only autoware-carla-scenario is still held
    # at 3.10, by the cp310-only CARLA client. This job converts a fixture map
    # with nothing but 'pip install .' on newer interpreters, so that claim
    # cannot quietly stop being true.
    #
    # 3.13 is left out on purpose: asam-qc-opendrive caps numpy below 2.0, and
    # numpy 1.26 has no cp313 wheel, so a 3.13 install compiles numpy from
    # source. It works, but it is no longer the wheels-only install this job
    # exists to prove. Add 3.13 here once that cap is lifted upstream.
    name: converter on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the converter from source with pip
      run: |
        python -m venv .venv-modern
        .venv-modern/bin/pip install --upgrade pip
        .venv-modern/bin/pip install ./autoware_lanelet2_to_opendrive

    - name: Convert a fixture map
      run: |
        .venv-modern/bin/convert \
          map=example_mgrs_offset \
          target=carla \
          input_map_path=autoware_lanelet2_to_opendrive/test/data/walkway_mini.osm \
          output_map_path=walkway_mini.xodr
        .venv-modern/bin/python -c "
        import lxml.etree as ET
        root = ET.parse('walkway_mini.xodr').getroot()
        roads = root.findall('.//road')
        assert roads, 'converter produced no <road> elements'
        print(f'{len(roads)} road(s) emitted')
        "

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        run-precommit: "true"
        precommit-continue-on-error: "false"
        carla-extra: "carla"

  auto-format:
    name: Auto-fix formatting
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-dev-deps: "true"
          run-precommit: "false"
          carla-extra: "carla"

      - name: Run pre-commit auto-fix
        run: uv run pre-commit run --all-files || true

      - name: Commit and push if changes were made
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: auto-fix formatting with pre-commit"
          git push

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        run-precommit: "false"
        carla-extra: "carla"

    - name: Build lanelet2-to-opendrive documentation
      uses: ./.github/actions/build-docs
      with:
        package-dir: autoware_lanelet2_to_opendrive
        config-file: mkdocs.ci.yml
        strict: "true"

    - name: Build carla-scenario documentation
      uses: ./.github/actions/build-docs
      with:
        package-dir: autoware_carla_scenario
        config-file: mkdocs.ci.yml
        strict: "true"

    - name: Upload lanelet2-to-opendrive documentation artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: documentation-lanelet2-to-opendrive
        path: autoware_lanelet2_to_opendrive/site/
        retention-days: 7

    - name: Upload carla-scenario documentation artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: documentation-carla-scenario
        path: autoware_carla_scenario/site/
        retention-days: 7

  check-src-changes:
    runs-on: ubuntu-latest
    outputs:
      src-changed: ${{ steps.filter.outputs.src }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          src:
            - 'autoware_lanelet2_to_opendrive/src/autoware_lanelet2_to_opendrive/**'

  carla-import-test:
    needs: check-src-changes
    if: needs.check-src-changes.outputs.src-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        run-precommit: "false"
        carla-extra: "carla"

    - name: Convert Lanelet2 map to OpenDRIVE (CARLA target)
      run: |
        uv run convert \
          map=nishishinjuku \
          target=carla \
          input_map_path=autoware_lanelet2_to_opendrive/test/data/nishishinjuku.osm \
          output_map_path=nishishinjuku_carla.xodr

    - name: Run CARLA import test
      run: |
        set -o pipefail
        uv run carla-import-test nishishinjuku_carla.xodr \
          --map-name nishishinjuku \
          | tee carla_import_test_result.txt

    - name: Run QC analysis
      run: |
        set -o pipefail
        uv run analyze nishishinjuku_carla.xodr \
          autoware_lanelet2_to_opendrive/test/data/nishishinjuku.osm \
          --output nishishinjuku_carla_qc_report.xqar \
          | tee analyze_result.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nishishinjuku_carla_artifacts
        path: |
          nishishinjuku_carla.xodr
          carla_import_test_result.txt
          nishishinjuku_carla_qc_report.xqar
          analyze_result.txt
        retention-days: 7

  scenario-image:
    # Proves the packing action end-to-end: scaffold a scenario package the way
    # a user would, pack it, and let the action's smoke test confirm that the
    # image really carries the pinned CARLA client and a registered scenario.
    name: scenario image (CARLA ${{ matrix.carla-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        carla-version: ["0.10.0", "0.9.16"]

    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        python-version: "3.10"
        install-dev-deps: "true"
        # The job only runs one console script; the dev group (mkdocs,
        # weasyprint, mypy, ...) would be installed and never touched.
        sync-dev-group: "false"
        run-precommit: "false"

    - name: Scaffold a scenario package
      run: uv run scenario-new ci_probe_package --output-dir "${RUNNER_TEMP}/packages"

    - name: Pack it into an image
      uses: ./.github/actions/pack-scenario-image
      id: pack
      with:
        scenario-package-path: ${{ runner.temp }}/packages/ci_probe_package
        image: ci-probe-scenario
        carla-version: ${{ matrix.carla-version }}
        push: "false"

    - name: Report the image size
      run: |
        docker image ls --format \
          '### Scenario image `{{ .Repository }}:{{ .Tag }}` — {{ .Size }}' \
          "${{ steps.pack.outputs.image-ref }}" | tee -a "${GITHUB_STEP_SUMMARY}"

  qc-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        run-precommit: "false"
        carla-extra: "carla"
    - name: Convert fixture map
      run: |
        uv run convert \
          map=nishishinjuku target=carla \
          input_map_path=autoware_lanelet2_to_opendrive/test/data/nishishinjuku.osm \
          output_map_path=nishishinjuku_carla.xodr
    - name: Run qc-framework validation
      run: uv run qc-validate nishishinjuku_carla.xodr
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qc-validate-artifacts
        path: nishishinjuku_carla.xodr
        retention-days: 7
