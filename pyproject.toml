[tool.uv.workspace]
members = [
    "autoware_lanelet2_to_opendrive",
]

[tool.uv.sources]
lanelet2-python-api-for-autoware = { git = "https://github.com/tier4/lanelet2_python_api_for_autoware", rev = "bfe2846deeca7fd09b1c1fb623c6f53c3609b681" }
# Use the tier4 fork's integration branch, which carries the relaxed numpy
# upper bound (upstream PR: asam-ev/qc-opendrive#138) plus the checker fixes
# that are still open as tier4/qc-opendrive#5-#8. Two of those decide whether
# road.geometry.contact_point reports 6 failures or the 644 it actually has:
# the check aborts on a road with no <link> (optional per the schema, and 475
# of our roads omit it), and its junction exemption tests `junction == 1`
# instead of utils.road_belongs_to_junction, so it evaluates 8,195 roads it
# should skip. Pinned by commit, not by branch name, so the resolution stays
# reproducible; move back to a tag once the fixes are merged and released.
asam-qc-opendrive = { git = "https://github.com/tier4/qc-opendrive.git", rev = "5cbf000285642cf3f079291d6eca9e533421e3e0" }

[dependency-groups]
dev = [
    "black>=25.11.0",
    "filelock>=3.13.0",
    "lark>=1.3.1",
    "mike>=2.1.3",
    "mkdocs>=1.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=0.27.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    # Used only by the TransverseMercator round-trip test (issue #541) to
    # independently verify the PROJ string produced by
    # latlon_to_tmerc_proj_string(); not used by production conversion code.
    "pyproj>=3.6",
    "pytest>=9.0.3",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "weasyprint>=68.0",
]

[tool.mypy]
ignore_missing_imports = true
exclude = ["conftest\\.py$"]

[[tool.mypy.overrides]]
# Pre-existing type errors in the l2o package are out of scope for this PR.
# They were not caught before because mypy ran on individual staged files only.
module = [
    "autoware_lanelet2_to_opendrive",
    "autoware_lanelet2_to_opendrive.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "autoware_lanelet2_to_opendrive/test",
    "scripts",
]
# No addopts: a bare ``pytest <node id>`` runs exactly that test. Opt in to
# ``-n N`` (pytest-xdist) or ``--testmon`` per invocation. See
# autoware_lanelet2_to_opendrive/docs/development.md.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring a running CARLA server",
]
