[tool.uv]
find-links = ["carla_wheels"]

[tool.uv.workspace]
members = [
    "autoware_lanelet2_to_opendrive",
    "autoware_carla_scenario",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "filelock>=3.13.0",
    "lark>=1.3.1",
    "mike>=2.1.3",
    "mkdocs>=1.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=0.27.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.3",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "weasyprint>=68.0",
]

[tool.mypy]
ignore_missing_imports = true
exclude = ["conftest\\.py$"]
# Needed for the `lanelet2` override below: without it, mypy follows stub files
# regardless of any per-module `follow_imports` setting.
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# simple-lanelet2 1.0.3 ships generated stubs that do not parse: `lanelet2.core`
# and `lanelet2.routing` carry Argument Clinic's `$type` marker, and
# `lanelet2.traffic_rules` a parameter literally named `from`. mypy treats an
# unparseable stub as fatal, so a single bad line aborts the run for the whole
# workspace. Nothing is lost by not following them -- every signature in those
# stubs is annotated `Any`. Fixed upstream in hakuturu583/simple_lanelet2; drop
# this override once the release carrying that fix is the minimum here.
module = ["lanelet2", "lanelet2.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Pre-existing type errors in the l2o package are out of scope for this PR.
# They were not caught before because mypy ran on individual staged files only.
module = [
    "autoware_lanelet2_to_opendrive",
    "autoware_lanelet2_to_opendrive.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "autoware_lanelet2_to_opendrive/test",
    "autoware_carla_scenario/test",
]
addopts = "-n auto --testmon"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring a running CARLA server",
]
