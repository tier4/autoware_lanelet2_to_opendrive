[tool.uv]
find-links = ["carla_wheels"]

[tool.uv.workspace]
members = [
    "autoware_lanelet2_to_opendrive",
    "autoware_carla_scenario",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "filelock>=3.13.0",
    # Regenerates the vendored alpasim protobuf modules; must stay on the protobuf 4.x
    # line so the generated code matches the pinned runtime.
    "grpcio-tools>=1.60,<1.63",
    "lark>=1.3.1",
    "mike>=2.1.3",
    "mkdocs>=1.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=0.27.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.3",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "weasyprint>=68.0",
]

[tool.ruff]
# Generated protobuf modules are verbatim protoc output; they are regenerated by
# autoware_carla_scenario/scripts/compile_protos.py, not hand-maintained.
extend-exclude = [
    "autoware_carla_scenario/src/autoware_carla_scenario/driver/_proto",
    "autoware_carla_scenario/src/autoware_carla_scenario/autoware_bridge/_proto",
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "conftest\\.py$",
    "autoware_carla_scenario/src/autoware_carla_scenario/driver/_proto/",
    "autoware_carla_scenario/src/autoware_carla_scenario/autoware_bridge/_proto/",
]

[[tool.mypy.overrides]]
# Generated protobuf modules carry no useful annotations of their own.
module = [
    "autoware_carla_scenario.driver._proto.*",
    "autoware_carla_scenario.autoware_bridge._proto.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Pre-existing type errors in the l2o package are out of scope for this PR.
# They were not caught before because mypy ran on individual staged files only.
module = [
    "autoware_lanelet2_to_opendrive",
    "autoware_lanelet2_to_opendrive.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "autoware_lanelet2_to_opendrive/test",
    "autoware_carla_scenario/test",
]
addopts = "-n auto --testmon"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring a running CARLA server",
]
