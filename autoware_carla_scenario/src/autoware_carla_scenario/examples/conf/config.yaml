defaults:
  - _self_
  - server: localhost
  - ego: default
  - entity: default
  - driver: default
  - bridge: default
  - traffic_manager: default
  # 'map' precedes 'scenario' so a scenario config can select its own map with
  # `defaults: [override /map: <name>]` (Hydra only lets a group override another
  # that appears earlier).  Scenarios that don't override it keep this default.
  # The two groups set disjoint keys, so the order does not change the merge.
  - map: nishishinjuku
  - scenario: intersection_passing/left_turn

server:
  host: localhost
  port: 2000

traffic_manager:
  port: 8100

map:
  name: ???
  xodr_path: null
  lanelet2_path: null
  no_3d_model_lanelet_ids: []

ego:
  vehicle_type: vehicle.mini.cooper
  initial_speed_kmh: 0.0
  spawn_lanelet_id: 242
  spawn_s: 25.0
  # autopilot | autoware | carla_driver
  entity: autopilot

entity:
  ground_projection_ray_distance_upper: 5.0
  ground_projection_ray_distance_lower: 10.0
  spawn_retry_max_count: 10
  spawn_retry_t_step: 0.1
  spawn_retry_z_step: 0.5
