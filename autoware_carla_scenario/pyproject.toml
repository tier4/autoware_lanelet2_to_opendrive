[project]
name = "autoware-carla-scenario"
version = "0.1.0"
description = "CARLA scenario testing framework for Autoware"
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
# Capped at 3.10 by the CARLA client alone: 0.10.0 is not published to PyPI and
# the wheel vendored in carla_wheels/ is cp310-only. Nothing else in this package
# — and nothing in autoware-lanelet2-to-opendrive — is limited to 3.10 any more.
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyxodr>=0.1.0",
    # Headless: the only OpenCV calls in this package are imencode and
    # pointPolygonTest -- there is no imshow/namedWindow anywhere, so the GUI
    # build would add ~125 MB of GTK/GStreamer libraries (and a libGL system
    # dependency) that nothing calls.
    "opencv-python-headless>=4.8",
    "numpy>=1.21",
    "pytest>=9.0.1",
    "python-dotenv>=1.2.2",
    # See the note in autoware_lanelet2_to_opendrive/pyproject.toml: `lanelet2`
    # and `autoware_lanelet2_extension_python` are provided by simple-lanelet2.
    "simple-lanelet2>=1.1.2",
    "tqdm>=4.67.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "ffmpeg-python>=0.2.0",
    # Speaks the alpasim `egodriver` gRPC contract to an external driver policy.
    # The protobuf definitions are vendored (see proto/README.md) rather than pulled
    # from `alpasim-grpc`, which requires Python >= 3.11 and so cannot coexist with the
    # CPython-3.10-only CARLA 0.10.0 wheel.
    "grpcio>=1.60",
    "protobuf>=4.25.0,<5.0.0",
]

[project.optional-dependencies]
carla = ["carla==0.10.0"]
carla-0-9-16 = ["carla==0.9.16"]

[tool.uv]
conflicts = [
    [
        { extra = "carla" },
        { extra = "carla-0-9-16" },
    ],
]

[build-system]
# hatchling (not uv_build) so the custom build hook in hatch_build.py can
# generate the protobuf stubs at build time; grpcio-tools is only needed in the
# isolated build environment, and protobuf is pinned to the 4.x line the runtime
# uses so the generated modules match it.
requires = [
    "hatchling>=1.25",
    # Same pin as the dev group's grpcio-tools so the build-hook output matches a
    # manual `uv run python scripts/compile_protos.py` (both on the protobuf 4.x line).
    "grpcio-tools>=1.60,<1.63",
    "protobuf>=4.25.0,<5.0.0",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `hydra_plugins` is a PEP 420 namespace package shared with Hydra itself, so its
# two plugins are listed individually; hatchling maps each `src/<pkg>` to `<pkg>`
# in the wheel.
packages = [
    "src/autoware_carla_scenario",
    "src/hydra_plugins/autoware_scenario_searchpath",
    "src/hydra_plugins/autoware_scenario_sweeper",
]

# The `*/_proto` stubs are generated by the build hook and are git-ignored, so
# they must be declared as artifacts or hatchling would exclude them (it honours
# VCS ignores by default) from the wheel/sdist.
[tool.hatch.build]
artifacts = [
    "src/autoware_carla_scenario/**/_proto/*.py",
    "src/autoware_carla_scenario/**/_proto/*.pyi",
]

# Generate the protobuf stubs (scripts/compile_protos.py) before each build; see
# hatch_build.py.
[tool.hatch.build.hooks.custom]

[project.scripts]
scenario = "autoware_carla_scenario.examples.run:main"
scenario-new = "autoware_carla_scenario.scaffold.generator:main"
detect-no-3d-model = "autoware_carla_scenario.tools.detect_no_3d_model_lanelets:main"
viewer = "autoware_carla_scenario.ui:main"
