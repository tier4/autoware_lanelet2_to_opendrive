# CPU-only CARLA server for CI traffic simulation.
#
# Inspired by boundrivesim/starter-carla-0913, but pinned to CARLA 0.9.15 and
# the official image. The server runs headless on the CPU.
#
# CPU-only rendering: the official CARLA image bundles the full UE4 renderer.
# On a GPU-less runner it is driven through OpenGL software rendering:
#
#   -opengl                 use the OpenGL RHI instead of Vulkan
#   Xvfb virtual display    a fake X server (DISPLAY=:99) started on the runner
#                           and shared into the container via /tmp/.X11-unix
#   LIBGL_ALWAYS_SOFTWARE=1 force Mesa's llvmpipe software rasterizer
#   XDG_RUNTIME_DIR         Mesa/EGL refuse to init without it
#   -nosound / -quality-level=Low  keep the footprint light
#
# NOTE: -nullrhi segfaults the UE4 engine on this build, and -RenderOffScreen
# needs a real Vulkan device, so neither is used. OpenGL + Xvfb + llvmpipe is
# the CPU-only path. The runner must start Xvfb on :99 before `up`.
#
# The image is overridable via the CARLA_IMAGE environment variable so the same
# file can pin a different patch release without edits.
#
# Usage:
#   Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
#   CARLA_IMAGE=carlasim/carla:0.9.15 \
#     docker compose -f docker-compose.carla.yml up -d
#   ... run the client ...
#   docker compose -f docker-compose.carla.yml down

services:
  carla-server:
    image: ${CARLA_IMAGE:-carlasim/carla:0.9.15}
    container_name: carla-server
    # CarlaUE4.sh lives in the image's home directory; set it explicitly so the
    # relative launch does not depend on the image's default WORKDIR.
    working_dir: /home/carla
    environment:
      # Connect to the Xvfb display shared from the host and force software GL.
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      XDG_RUNTIME_DIR: "/tmp/runtime-carla"
    volumes:
      # Share the host's Xvfb X11 socket so OpenGL has a display to render into.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >-
      /bin/bash -c "mkdir -p /home/carla/recordings /tmp/runtime-carla &&
      chmod 700 /tmp/runtime-carla && ./CarlaUE4.sh
      -opengl -nosound -quality-level=Low
      -carla-rpc-port=2000"
    ports:
      # RPC (2000), streaming (2001), secondary (2002) and Traffic Manager (8000).
      - "2000-2002:2000-2002"
      - "8000:8000"
    # 1 GB of shared memory is enough for asset streaming and fits a stock
    # GitHub-hosted runner's RAM budget.
    shm_size: "1gb"
    restart: "no"
