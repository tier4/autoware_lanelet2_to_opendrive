[project]
name = "intersection-passing-package"
version = "0.1.0"
description = "IntersectionPassing scenario package for autoware_carla_scenario"
requires-python = ">=3.10,<3.11"
dependencies = [
    "autoware-carla-scenario",
]

[project.entry-points."autoware_carla_scenario.scenarios"]
intersection_passing_package = "intersection_passing_package:register"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv-build]
packages = ["src/intersection_passing_package"]
