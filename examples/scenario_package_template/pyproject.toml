[project]
name = "my-scenario-package"
version = "0.1.0"
description = "Example standalone scenario package for autoware_carla_scenario"
requires-python = ">=3.10,<3.11"
dependencies = [
    # The scenario framework provides the public API (register_scenario,
    # register_conf_dir, BaseScenario, the shared config dataclasses, ...).
    "autoware-carla-scenario",
]

# This entry point is what makes the package discoverable.  When it is
# installed, `uv run scenario ...` calls `my_scenario_package:register`
# automatically at start-up, which registers the scenario and its conf dir.
[project.entry-points."autoware_carla_scenario.scenarios"]
my_scenario_package = "my_scenario_package:register"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv-build]
packages = ["src/my_scenario_package"]
